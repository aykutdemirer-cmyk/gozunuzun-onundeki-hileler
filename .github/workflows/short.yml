name: Shorts Üret

on:
  push:
    paths: ["episodes/*.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Bölüm dosyası (örn. episodes/01_ekmek_sut.json)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow edge-tts imageio-ffmpeg requests

      - name: Bölümleri belirle
        id: ep
        run: |
          if [ -n "${{ inputs.episode }}" ]; then F="${{ inputs.episode }}"
          else F=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'episodes/*.json' | tr '\n' ' '); fi
          echo "files=$F" >> "$GITHUB_OUTPUT"

      - name: Render et ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          for F in ${{ steps.ep.outputs.files }}; do
            N=out/$(basename "$F" .json).mp4
            python render.py "$F" "$N"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then python send_telegram.py "$N" "$F"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4
