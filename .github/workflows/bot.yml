name: Telegram Bot ve Günlük Video

on:
  schedule:
    - cron: "*/5 * * * *"    # bot mesajları
    - cron: "47 6 * * *"     # günlük video (~09:47 TR)
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Mesajları işle
        id: bot
        run: |
          pip install -q requests
          if [ "${{ github.event.schedule }}" = "47 6 * * *" ]; then python bot.py daily; else python bot.py; fi

      - name: Video üret ve gönder
        if: steps.bot.outputs.episodes != ''
        run: |
          pip install -q pillow edge-tts imageio-ffmpeg
          mkdir -p out
          for F in ${{ steps.bot.outputs.episodes }}; do
            N=out/$(basename "$F" .json).mp4
            python render.py "$F" "$N" && python send_telegram.py "$N" "$F" \
              || python -c "import os,requests;requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage',json={'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':'⚠️ Video üretilemedi: $F'})"
          done

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "shorts-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A state episodes queue 2>/dev/null; git diff --cached --quiet || (git commit -qm "bot: durum güncellendi" && git pull -q --rebase && git push -q)
