name: Günlük Video

on:
  schedule:
    - cron: "47 6 * * *"   # her gün ~09:47 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow edge-tts imageio-ffmpeg
      - name: Konu ve senaryo
        id: ep
        run: python daily.py
      - name: Video üret ve gönder
        run: |
          mkdir -p out
          python render.py "${{ steps.ep.outputs.episode }}" out/gunluk.mp4
          python send_telegram.py out/gunluk.mp4 "${{ steps.ep.outputs.episode }}"
      - name: Bölümü kaydet
        run: |
          git config user.name "shorts-bot"; git config user.email "actions@users.noreply.github.com"
          git add episodes && git commit -qm "Günlük bölüm" && git pull -q --rebase && git push -q
      - name: Hata bildir
        if: failure()
        run: python -c "import os,requests;requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage',json={'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':'⚠️ Günlük video üretilemedi, GitHub Actions loguna bak.'})"
